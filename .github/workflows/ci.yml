name: CI
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/verify.yml
    with:
      suite: quick
      release-base: ${{ github.base_ref == 'main' && github.event.pull_request.base.sha || '' }}
